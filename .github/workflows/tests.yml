name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: ./setup.sh --no-ns3 --no-gateway
      - run: .venv/bin/python -m pytest -q
      - name: conformance against the mock ledger
        run: |
          PORT=3100 .venv/bin/python ledger/mock/mock_ledger_server.py &
          for i in $(seq 30); do curl -sf http://127.0.0.1:3100/health && break; sleep 1; done
          LEDGER=mock LEDGER_URL=http://127.0.0.1:3100 .venv/bin/python -m pytest -q ledger/tests

  chaincode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ledger/chaincode/vanetauth/go.mod
      - run: go vet ./... && go test ./...
        working-directory: ledger/chaincode/vanetauth
